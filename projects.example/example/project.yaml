version: 1

# Optional: what the console calls the project instead of its folder name, and a line about what it is.
# name: Example
# description: What this project is and who it is for.

# The repository this project works on, and how the shop checks the work before opening a pull request.
# To start from nothing on this machine instead of GitHub, replace repo with `local: true`. Such a project may
# also let the shop merge its low-risk orders on its own with `auto_merge: {}` (see docs/configuration.md).
repo: OWNER/REPO
base_branch: main
setup_command: npm ci
verify_commands: ["npm run typecheck", "npm test"]
# Files the worker may not touch without the director's signature.
protected_paths: [".github/", ".claude/", ".mcp.json", "AGENTS.md", "CLAUDE.md", "vitest.config*"]

# Optional: a GitHub project board whose Status column follows the orders (Todo, In Progress, Done: the options of a new GitHub board; add "In Review" and name it below to use it).
# The names are the usual ones; list `columns` only to rename them.
# board:
#   owner: your-login
#   number: 13
#   columns: { in_review: "In Review" }

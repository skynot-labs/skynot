version: 1

# One entry per role. `engine` is claude or codex. `model` is optional: leave it out and the CLI's own
# default applies (the log records which model actually answered).
roles:
  manager:
    engine: claude
  developer:
    engine: claude
  # Optional. Reads every pull request's diff before you do; the one who wrote the code never approves it,
  # so it must differ from the developer in engine or model, or the service refuses to start. Leave it out
  # and nothing is reviewed.
  # code_reviewer:
  #   engine: codex

# Read-only roles the Manager can consult, up to three at once. `soul` is a markdown file, relative to
# this file; `description` is what the Manager sees when it decides whom to ask. Leave the section out
# and the Manager works alone.
advisors:
  architect:
    engine: claude
    description: how a change fits the existing code, and its risks
    soul: roles/architect.md
  reviewer:
    engine: claude
    description: skeptical review of a proposed order's scope and criteria
    soul: roles/reviewer.md

# Roles that are known but not on the team. The Manager may propose hiring one (or dismissing an
# advisor), and nothing changes until you sign the proposal in the console. Same shape as `advisors`.
library:
  designer:
    engine: claude
    description: screens, flows and wording a user reads
    soul: roles/designer.md

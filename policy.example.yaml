version: 1

# Used only when there is no projects/ folder; otherwise each project's own project.yaml says which repository
# it works on (see projects.example/).
repos:
  - name: OWNER/REPO
    base_branch: main
    setup_command: npm ci
    verify_commands: ["npm run typecheck", "npm test"]
    protected_paths: [".github/", ".claude/", ".mcp.json", "AGENTS.md", "CLAUDE.md", "vitest.config*"]

branch_prefix: "taller/"

labels:
  prefix: "taller:"
  trigger: "taller:implement"

limits:
  actions_per_order_per_day: 12
  actions_per_day: 60
  max_parallel: 4
  max_rounds: 2

run_budget:
  timeout_seconds: 900
  max_usd: 3.00
  max_usd_per_day: 10.00

memory:
  max_memory_chars: 6000
